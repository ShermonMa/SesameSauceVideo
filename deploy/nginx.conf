# SesameSauce 前端生产部署 Nginx 配置
# 功能：静态文件托管 + Vue Router history 模式支持 + API 反向代理
# 时间戳：2026-05-29

server {
    listen 80;
    server_name _;  # 监听所有域名/IP，如绑定域名请替换为具体域名

    # 前端构建产物目录（请根据实际部署路径修改）
    root /var/www/sesame-sauce/frontend/dist;
    index index.html;

    # Gzip 压缩，减少传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API 反向代理：将所有 /api 请求转发给后端 Go 服务
    # proxy_pass 末尾不能带斜杠，否则 Nginx 会去掉 /api/ 前缀，导致后端 404
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # MinIO 对象存储代理：处理公开资源（封面、HLS）和预签名请求（上传、下载）
    # 必须放在静态资源缓存 location 之前，否则 .jpg 等封面会被静态规则拦截
    # proxy_set_header Host 保持为 localhost:9000，确保 MinIO 预签名签名验证通过
    location ~ ^/(sesame-sauce|sesame-sauce-public)/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host localhost:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式传输优化（视频、大文件）
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # 静态资源缓存：JS/CSS/图片等长期不变文件
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vue Router history 模式支持：所有非文件请求都指向 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
